name: release

# Publish to PyPI when a version tag is pushed. The publish job uses
# trusted publishing: PyPI accepts a short-lived OIDC token that
# GitHub mints for this specific workflow and environment, so no API
# token is stored as a repository secret. The release path is part of
# this tool's supply chain, and a credential that does not exist
# cannot leak.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Re-run everything ci.yml runs on the tagged commit: the Python
  # matrix, the FastAPI version matrix, and the CLI self-check. The
  # build and publish jobs depend on this job, so nothing is built,
  # let alone uploaded, unless all of it passed.
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: build
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        run: |
          version=$(PYTHONPATH=src python -c "import scope_parity; print(scope_parity.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match scope_parity.__version__ $version" >&2
            exit 1
          fi
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
      - name: Check the distributions
        run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to pypi
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/project/scope-parity/
    permissions:
      # This is the only credential the upload uses; it is minted per
      # run and expires with it.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
