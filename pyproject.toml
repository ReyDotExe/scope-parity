[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scope-parity"
dynamic = ["version"]
description = "parity checks between a route registry and a permission registry"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["authorization", "scopes", "permissions", "ci", "lint"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
scope-parity = "scope_parity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "scope_parity.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
