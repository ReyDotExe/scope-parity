[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scope-parity"
dynamic = ["version"]
description = "parity checks between a route registry and a permission registry"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["authorization", "scopes", "permissions", "ci", "lint"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Repository = "https://github.com/ReyDotExe/scope-parity"
Changelog = "https://github.com/ReyDotExe/scope-parity/blob/main/CHANGELOG.md"
Security = "https://github.com/ReyDotExe/scope-parity/blob/main/SECURITY.md"
Issues = "https://github.com/ReyDotExe/scope-parity/issues"

[project.optional-dependencies]
# The adapter reads FastAPI internals, so the upper bound is the last
# version the CI matrix has passed against; raise it only together
# with the matrix and the README.
fastapi = ["fastapi>=0.100,<0.142"]
pytest = ["pytest>=8"]
test = ["pytest>=8", "fastapi>=0.100,<0.142"]

[project.scripts]
scope-parity = "scope_parity.cli:main"

[project.entry-points.pytest11]
scope_parity = "scope_parity.pytest_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "scope_parity.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# scope-parity checks its own demo registry: the CLI target for the
# self-check CI job, and the pytest plugin's collected test.
[tool.scope-parity]
target = "examples.demo_registry"
pytest = true
